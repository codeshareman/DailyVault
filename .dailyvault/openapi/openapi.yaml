openapi: 3.1.0
info:
  title: DailyVault API
  version: 1.0.0
  description: Local API for Daily-first DailyVault records.
servers:
  - url: http://127.0.0.1:3417
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: Service is available.
  /daily/{date}:
    get:
      summary: Read one Daily note
      parameters:
        - $ref: '#/components/parameters/date'
      responses:
        '200':
          description: Daily note content.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyNote'
        '404':
          description: Daily note does not exist.
  /daily/{date}/append:
    post:
      summary: Preview or append one item to a Daily section
      parameters:
        - $ref: '#/components/parameters/date'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppendDailyRequest'
      responses:
        '200':
          description: Preview or saved Daily note.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppendDailyResult'
        '400':
          description: Invalid section, content, or dry_run value.
components:
  parameters:
    date:
      name: date
      in: path
      required: true
      schema:
        type: string
        pattern: '^\\d{4}-?\\d{2}-?\\d{2}$'
      description: YYYY-MM-DD or YYYYMMDD.
  schemas:
    DailyNote:
      type: object
      required: [path, markdown]
      properties:
        path:
          type: string
          example: Daily/20260817.md
        markdown:
          type: string
    AppendDailyRequest:
      type: object
      required: [section, content]
      properties:
        section:
          type: string
          enum: [今日计划, 随手记录, 输入, 输出, 生活时间线, 学到, 复盘, 明日 / 迁移]
        content:
          type: string
          minLength: 1
          example: '- 读了一篇文章 #kind/article'
        dry_run:
          type: boolean
          default: true
    AppendDailyResult:
      type: object
      required: [path, dry_run, markdown]
      properties:
        path:
          type: string
        dry_run:
          type: boolean
        saved:
          type: boolean
        markdown:
          type: string
