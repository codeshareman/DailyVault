openapi: 3.1.0
info:
  title: DailyVault API
  version: 1.1.0
  description: |
    DailyVault 的本地 API，只提供对 `YYYY/YYYY-MM-DD.md` 的读取与追加。
    默认仅监听 127.0.0.1:3417，所有写操作默认 dry_run 预览。
servers:
  - url: http://127.0.0.1:3417
paths:
  /health:
    get:
      summary: 健康检查
      responses:
        '200':
          description: 服务可用。
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /openapi.yaml:
    get:
      summary: 返回本 API 契约
      responses:
        '200':
          description: OpenAPI 3.1 契约文本。
          content:
            application/yaml:
              schema:
                type: string
  /daily/{date}:
    get:
      summary: 读取指定日期的 Daily 笔记
      parameters:
        - $ref: '#/components/parameters/date'
      responses:
        '200':
          description: Daily 笔记内容。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyNote'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          description: Daily 笔记不存在。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /daily/{date}/append:
    post:
      summary: 预览或追加一条内容到 Daily 指定章节
      description: 默认 dry_run=true 只返回预览；dry_run=false 才会写入文件并记录审计。
      parameters:
        - $ref: '#/components/parameters/date'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppendDailyRequest'
      responses:
        '200':
          description: 预览或写入后的 Daily 笔记。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppendDailyResult'
        '400':
          $ref: '#/components/responses/Error400'
        '413':
          description: 请求体超过 256KB。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  parameters:
    date:
      name: date
      in: path
      required: true
      schema:
        type: string
        pattern: '^\d{4}-?\d{2}-?\d{2}$'
      description: YYYY-MM-DD 或 YYYYMMDD。
  responses:
    Error400:
      description: 参数或请求体无效。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: 日期无效，期望 YYYY-MM-DD 或 YYYYMMDD：2026-8-1
    DailyNote:
      type: object
      required: [path, markdown]
      properties:
        path:
          type: string
          example: 2026/2026-08-17.md
        markdown:
          type: string
    AppendDailyRequest:
      type: object
      required: [section, content]
      additionalProperties: false
      properties:
        section:
          type: string
          enum: [今日计划, 随手记录, 输入, 输出, 生活时间线, 学到, 复盘, 明日 / 迁移]
        content:
          type: string
          minLength: 1
          example: '- 读了一篇文章 #kind/article'
        dry_run:
          type: boolean
          default: true
    AppendDailyResult:
      type: object
      required: [path, dry_run, markdown]
      properties:
        path:
          type: string
        dry_run:
          type: boolean
        saved:
          type: boolean
        markdown:
          type: string
